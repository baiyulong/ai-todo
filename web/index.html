<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>AI Todo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!-- 登录 -->
<div id="login" class="login-screen" hidden>
  <form class="login-card" id="login-form">
    <div class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </div>
    <h1>登录 AI Todo</h1>
    <p class="login-hint">用你的账号登录。管理员账号的初始密码见 <code>data/admin-credentials.txt</code>。</p>
    <input id="login-username" type="text" placeholder="用户名" autocomplete="username" spellcheck="false" autocapitalize="off" required>
    <input id="login-password" type="password" placeholder="密码" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary btn-block">进入</button>
    <p class="login-error" id="login-error" hidden></p>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <div class="topbar-left">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </span>
      <span class="brand">AI Todo</span>
      <span class="pending-pill" id="pending-pill" hidden>0</span>
    </div>
    <div class="topbar-right">
      <span class="live-dot" id="live-dot" data-state="connecting" title="实时连接状态"><i></i><span id="live-text">连接中</span></span>

      <!-- 当前用户：点开可看账号信息、账号与令牌、退出登录 -->
      <div class="user-menu" id="user-menu">
        <button class="user-chip" id="btn-user" aria-haspopup="menu" aria-expanded="false" title="当前账号" hidden>
          <span class="avatar" id="user-avatar" aria-hidden="true">·</span>
          <span class="user-name" id="user-name"></span>
          <svg class="user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="user-dropdown" id="user-dropdown" role="menu" hidden>
          <div class="user-dropdown-head">
            <div class="user-dropdown-name" id="dd-name">—</div>
            <div class="user-dropdown-role" id="dd-role">—</div>
          </div>
          <button class="user-menu-item" id="dd-account" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>账号与令牌</span>
          </button>
          <button class="user-menu-item is-danger" id="dd-logout" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
            <span>退出登录</span>
          </button>
        </div>
      </div>

      <button class="icon-btn" id="btn-rules" title="通知规则">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      </button>
    </div>
  </header>

  <!-- 通知权限提示 -->
  <div class="banner" id="notify-banner" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
    <span id="notify-banner-text">开启桌面通知，AI 完成任务时立刻弹横幅提醒。</span>
    <button class="btn btn-sm btn-primary" id="btn-enable-notify">开启通知</button>
    <button class="icon-btn icon-btn-sm" id="btn-dismiss-banner" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- 工具栏 -->
  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab is-active" data-status="pending">待处理</button>
      <button class="tab" data-status="acked">已接手</button>
      <button class="tab" data-status="done">已完成</button>
      <button class="tab" data-status="all">全部</button>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-sm btn-quiet btn-danger" id="btn-clear-archived" hidden>清空已归档</button>
      <select class="select" id="filter-severity" aria-label="按级别筛选">
        <option value="">全部级别</option>
        <option value="blocker">阻塞</option>
        <option value="need_human">需处理</option>
        <option value="info">记录</option>
      </select>
      <input class="input" id="filter-q" type="search" placeholder="搜索…" aria-label="搜索任务">
    </div>
  </div>

  <!-- 列表 -->
  <main class="main">
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>
      <div class="empty-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      </div>
      <p class="empty-title">这里很安静</p>
      <p class="empty-sub">AI 完成任务后会通过 MCP 把需要你关注的事项推到这里。</p>
    </div>
  </main>

  <!-- 新增任务（手动） -->
  <button class="fab" id="btn-add" title="手动添加任务">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<!-- 侧栏：规则 / 设置 -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="设置">
  <div class="drawer-head">
    <h2 id="drawer-title">通知规则</h2>
    <button class="icon-btn" id="btn-close-drawer" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<!-- 新增任务对话框 -->
<dialog class="dialog" id="task-dialog">
  <form method="dialog" class="dialog-inner" id="task-form">
    <h2>手动添加任务</h2>
    <label class="field">
      <span>标题</span>
      <input class="input" id="new-title" required maxlength="200" placeholder="需要我做什么？">
    </label>
    <label class="field">
      <span>详情（可选）</span>
      <textarea class="input" id="new-detail" rows="3" maxlength="8000" placeholder="补充上下文"></textarea>
    </label>
    <div class="field-row">
      <label class="field">
        <span>级别</span>
        <select class="select" id="new-severity">
          <option value="need_human">需处理</option>
          <option value="blocker">阻塞</option>
          <option value="info">记录</option>
        </select>
      </label>
      <label class="field">
        <span>项目</span>
        <input class="input" id="new-project" maxlength="120" placeholder="可选">
      </label>
    </div>
    <label class="check">
      <input type="checkbox" id="new-notify" checked>
      <span>立即提醒我</span>
    </label>
    <div class="dialog-actions">
      <button class="btn" value="cancel" type="submit" formnovalidate>取消</button>
      <button class="btn btn-primary" id="new-submit" value="ok" type="submit">添加</button>
    </div>
  </form>
</dialog>

<!-- 通用确认框：不可逆动作的二次确认 -->
<dialog class="dialog" id="confirm-dialog">
  <form method="dialog" class="dialog-inner" id="confirm-form">
    <h2 id="confirm-title">确认操作</h2>
    <p class="dialog-note" id="confirm-text"></p>
    <div class="dialog-actions">
      <button class="btn" value="cancel" type="submit" formnovalidate>取消</button>
      <button class="btn btn-danger-solid" id="confirm-ok" value="ok" type="submit">确定</button>
    </div>
  </form>
</dialog>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="/app.js" type="module"></script>
</body>
</html>
