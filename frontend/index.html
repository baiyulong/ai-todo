<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>AI Todo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<script>
  // 首屏前置：尽早定语言与主题，避免闪烁。
  // 逻辑与 src/i18n.js、src/theme.js 保持一致（那里会再正规初始化一遍）。
  (function () {
    try {
      var locale = localStorage.getItem('ai_todo_locale') || navigator.language || 'zh-CN';
      document.documentElement.lang = String(locale).toLowerCase().indexOf('zh') === 0 ? 'zh-CN' : 'en';
    } catch (e) { /* 隐私模式忽略 */ }
    try {
      var theme = localStorage.getItem('ai_todo_theme');
      if (!theme) theme = 'product';
      document.documentElement.dataset.theme = theme;
    } catch (e) {
      document.documentElement.dataset.theme = 'product';
    }
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
