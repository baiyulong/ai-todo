<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<title>AI Todo · 云端备份</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --line: #e5e7eb;
    --text: #1f2328; --muted: #6b7280; --brand: #2563eb; --danger: #dc2626; --ok: #16a34a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--text); }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .kv { font-size: 13px; color: var(--muted); }
  .kv b { color: var(--text); }
  button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--text);
           border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { font-size: 13px; padding: 8px 12px; border-radius: 8px; margin: 12px 0;
            display: none; white-space: pre-wrap; word-break: break-all; }
  #status.ok { display: block; background: #f0fdf4; color: var(--ok); border: 1px solid #bbf7d0; }
  #status.err { display: block; background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
  #status.info { display: block; background: #eff6ff; color: var(--brand); border: 1px solid #bfdbfe; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.title { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
          background: #f3f4f6; color: var(--muted); }
  .pill.pending { background: #fef9c3; color: #a16207; }
  .pill.done, .pill.acked { background: #dcfce7; color: #15803d; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI Todo · 云端备份面板</h1>
  <p class="sub">CloudBase 匿名登录 + 云数据库（PostgreSQL）只读面板 · 表 <code>cloud_todos</code></p>

  <div id="status"></div>

  <div class="card">
    <div class="row">
      <button class="primary" id="btn-connect">连接云端（匿名登录）</button>
      <button id="btn-refresh" disabled>刷新数据</button>
      <button id="btn-download" disabled>下载 JSON</button>
      <button id="btn-import" disabled>导入 JSON 到云端</button>
      <input type="file" id="file-import" accept=".json" hidden>
    </div>
    <p class="hint">
      当前页面域名：<code id="origin"></code><br>
      说明：CloudBase Web SDK 只允许在环境「Web 安全域名」内的页面调用。本环境的托管域名已内置白名单；
      从 <code>localhost</code> 打开本页会因域名不在白名单而失败——请从托管域名访问。
      「导入」只补插云端缺失的 <code>id</code>，已存在的行保持不变（真正的 upsert 备份走 CLI：<code>npm run cloud push</code>）。
    </p>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between">
      <span class="kv">云端任务：<b id="cloud-count">—</b> 条</span>
      <span class="kv">匿名用户：<b id="uid">—</b></span>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>状态</th><th>标题</th><th>项目</th><th>更新时间</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="kv">尚未连接</td></tr></tbody>
    </table>
  </div>
</div>

<script src="/cloud.js" type="module"></script>
</body>
</html>
